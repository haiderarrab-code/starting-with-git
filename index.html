<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام البحث الموحّد في قواعد البيانات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Local libraries (work offline) -->
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
</head>
<body>
  <!-- ===== IMPORT PROGRESS ===== -->
  <div id="importProgress">
    <div class="progress-label">
      <strong id="progressTitle">جاري الاستيراد...</strong>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="progressText">0%</span>
        <button onclick="skipImport()" title="تخطي الملف الحالي" style="background:var(--color-surface2);border:1px solid var(--color-border);cursor:pointer;color:var(--color-text-muted);font-size:0.75rem;padding:3px 10px;border-radius:var(--radius-full);font-family:inherit;transition:all 0.2s">تخطي ⏭</button>
        <button onclick="cancelImport()" title="إلغاء الاستيراد" style="background:none;border:1px solid #ef4444;cursor:pointer;color:#ef4444;font-size:0.75rem;padding:3px 10px;border-radius:var(--radius-full);font-family:inherit;transition:all 0.2s">إلغاء ✕</button>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- ===== BIG FILE DECISION MODAL ===== -->
  <div id="bigFileModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.6);align-items:center;justify-content:center">
    <div style="background:var(--color-surface,#1e293b);border:1px solid var(--color-border,#334155);border-radius:14px;max-width:440px;width:90%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.5)">
      <h3 style="margin:0 0 6px;color:var(--color-text,#e2e8f0);font-size:1.05rem">ملف كبير</h3>
      <p id="bigFileMsg" style="margin:0 0 18px;color:var(--color-text-muted,#94a3b8);font-size:0.85rem;line-height:1.7"></p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button id="bigFileFull"    style="background:#16a34a;color:#fff;border:none;padding:11px;border-radius:9px;font-family:inherit;font-size:0.9rem;cursor:pointer">استيراد كامل (قد يأخذ وقتاً)</button>
        <button id="bigFilePartial" style="background:#6366f1;color:#fff;border:none;padding:11px;border-radius:9px;font-family:inherit;font-size:0.9rem;cursor:pointer">استيراد أول 120 ألف صف (سريع)</button>
        <button id="bigFileSkip"    style="background:none;color:#ef4444;border:1px solid #ef4444;padding:11px;border-radius:9px;font-family:inherit;font-size:0.9rem;cursor:pointer">تخطّي هذا الملف</button>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--color-text-muted,#94a3b8);font-size:0.8rem;cursor:pointer">
        <input type="checkbox" id="bigFileApplyAll" /> طبّق نفس الاختيار على بقية الملفات الكبيرة
      </label>
    </div>
  </div>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
            <path d="M3 5v4c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
            <path d="M3 9v4c0 1.66 4.03 3 9 3s9-1.34 9-3V9"/>
            <path d="M3 13v4c0 1.66 4.03 3 9 3s9-1.34 9-3v-4"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">نظام البحث الموحّد</h1>
          <p class="brand-sub">في قواعد البيانات</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-theme" id="themeToggle" title="تبديل المظهر">
          <span class="theme-icon">🌙</span>
        </button>
        <button class="btn-export" id="exportBtn" title="تصدير كل البيانات في ملف Excel واحد" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          تصدير موحّد
        </button>
        <button class="btn-clear-all" id="clearAllBtn" title="مسح كل البيانات">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14H6L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4h6v2"/>
          </svg>
          مسح الكل
        </button>
      </div>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="app-main">

    <!-- Import Zone -->
    <section class="import-section">
      <div class="import-subtitle">استورد • ادمج • ابحث — يتم حفظ البيانات تلقائياً</div>
      <div class="import-buttons">

        <!-- Excel -->
        <div class="import-card excel-card">
          <button class="import-btn excel-btn" id="excelBtn" onclick="document.getElementById('excelFileInput').click()">
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="8" y1="13" x2="16" y2="13"/>
                <line x1="8" y1="17" x2="16" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
            </span>
            <span class="btn-label">Excel</span>
            <span class="btn-plus">+</span>
            <span class="record-badge excel-badge" id="excelBadge" style="display:none"></span>
          </button>
          <input type="file" id="excelFileInput" accept=".xlsx,.xls,.csv,.txt,.docx" style="display:none" multiple />
          <button class="chips-toggle" id="chipsToggle" onclick="toggleChips()">
            <span id="chipsToggleLabel">عرض الملفات</span>
            <span class="chips-toggle-arrow">▼</span>
          </button>
          <div class="source-chips" id="excelChips"></div>
        </div>


      </div>

      <!-- Folder import -->
      <div class="folder-import-row">
        <button class="btn-folder" id="folderBtn" onclick="document.getElementById('folderFileInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            <line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
          استيراد مجلد Excel كامل
        </button>
        <input type="file" id="folderFileInput" accept=".xlsx,.xls,.csv,.txt,.docx" webkitdirectory style="display:none" />
        <span class="folder-hint">اختر مجلداً يحتوي على ملفات Excel — يتم استيراد جميع الملفات تلقائياً</span>
      </div>
    </section>

    <!-- Stats Bar -->
    <div class="stats-bar" id="statsBar" style="display:none">
      <div class="stat-item">
        <span class="stat-num" id="totalSources">0</span>
        <span class="stat-label">مصدر</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-num" id="totalTables">0</span>
        <span class="stat-label">جدول</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-num" id="totalRecords">0</span>
        <span class="stat-label">سجل</span>
      </div>
    </div>

    <!-- Search Zone -->
    <section class="search-section" id="searchSection" style="display:none">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="ابحث في جميع المصادر..."
          autocomplete="off"
        />
        <button class="search-clear" id="searchClear" style="display:none" onclick="clearSearch()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <button class="filters-toggle" id="filtersToggle" onclick="toggleFilters()" style="display:none">
        <span id="filtersToggleLabel">فلترة المصادر</span>
        <span class="filters-toggle-arrow">▼</span>
      </button>
      <div class="search-filters" id="searchFilters"></div>
    </section>

    <!-- Notifications -->
    <div id="notification" class="notification" style="display:none"></div>

    <!-- Content Area -->
    <section class="content-area" id="contentArea">

      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg viewBox="0 0 80 80" fill="none">
            <circle cx="40" cy="40" r="38" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4" opacity="0.3"/>
            <ellipse cx="40" cy="30" rx="16" ry="5" stroke="currentColor" stroke-width="2" opacity="0.5"/>
            <path d="M24 30v6c0 2.76 7.16 5 16 5s16-2.24 16-5v-6" stroke="currentColor" stroke-width="2" opacity="0.5"/>
            <path d="M24 36v6c0 2.76 7.16 5 16 5s16-2.24 16-5v-6" stroke="currentColor" stroke-width="2" opacity="0.5"/>
            <path d="M33 55l-6 8M47 55l6 8" stroke="currentColor" stroke-width="2" opacity="0.3"/>
          </svg>
        </div>
        <h3 class="empty-title">لا توجد بيانات بعد</h3>
        <p class="empty-desc">استورد ملفات Excel (.xlsx / .xls / .csv) للبدء في البحث الموحّد</p>
      </div>

      <!-- Results / Preview -->
      <div id="dataArea" style="display:none">
        <!-- Tabs -->
        <div class="tabs-bar" id="tabsBar"></div>
        <!-- Tab content -->
        <div id="tabContent"></div>
      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
